name: AMZN Daily Close Predictor

on:
  schedule:
    # GitHub starts scheduled runs late: through September 2026 the 11:30 UTC slot fired at
    # 15:05-17:10 UTC, after the 13:30 UTC open, so every prediction since 2026-08-27 saw part
    # of the session it was forecasting. Every run is now idempotent and the work is split by
    # urgency (self-improvement_loop/src/loop/session.py):
    #   * evening slots score the session that just closed and research the next one (the LLM
    #     calls) - hours before the next open even when GitHub starts them late;
    #   * morning slots re-anchor the pending forecast on the latest pre-market trade (code only,
    #     no LLM cost), or research it if no evening run happened.
    # A run that lands after the open can only score and report; it can no longer write a
    # forecast. Odd minutes avoid the top-of-hour scheduling crush.
    - cron: "41 21 * * 1-5"   # evening, after the close (17:41 ET summer / 16:41 ET winter)
    - cron: "17 1 * * 2-6"    # evening fallback (21:17 ET summer / 20:17 ET winter)
    - cron: "7 9 * * 1-5"     # pre-market (05:07 ET summer)
    - cron: "7 11 * * 1-5"    # pre-market (07:07 ET summer)
    - cron: "37 12 * * 1-5"   # pre-market (08:37 ET summer)
    - cron: "13 13 * * 1-5"   # last refresh before the bell (09:13 ET summer / 08:13 ET winter)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "daily"
        type: choice
        options: [daily, score, predict, report, backfill]

concurrency:
  group: amzn-predict
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: self-improvement_loop

jobs:
  predict:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.pipeline.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: self-improvement_loop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name  "amzn-predictor-bot"
          git config user.email "actions@github.com"

      - name: Run daily pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          before=$(git rev-parse HEAD)
          python -m src.loop.run_ab --mode "${{ github.event.inputs.mode || 'daily' }}"
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: steps.pipeline.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: self-improvement_loop/results/site

  deploy-pages:
    needs: predict
    runs-on: ubuntu-latest
    # Only deploy from the default branch (scheduled runs already use it), and only when the
    # run committed something - most morning slots change nothing.
    if: >-
      needs.predict.outputs.changed == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
